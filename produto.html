<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CELINE — Detalhes da peça</title>
<link rel="icon" href="images/celine-logo.png">
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:#ffffff;color:#1c1a18;font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{display:block;width:100%;height:auto}
  /* Header: same rhythm as the reference — left menu, centre wordmark, right link.
     Sticky with a solid background, so nothing ever slides underneath it. */
  header{position:sticky;top:0;z-index:10;background:#ffffff;border-bottom:1px solid #eeeeee}
  .head{max-width:1240px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .head nav{display:flex;gap:26px;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
  .head nav a{padding:6px 0;border-bottom:1px solid transparent}
  .head nav a:hover{border-bottom-color:#7a1f2b}
  .wordmark{font-size:30px;letter-spacing:.42em;text-indent:.42em;font-weight:400}
  .btn{display:inline-block;background:linear-gradient(135deg,#7a1f2b 0%,#4a0d16 48%,#000000 100%);color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;padding:15px 36px;border-radius:999px}
  .btn:hover{opacity:.92}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img.logo{width:auto;height:46px}
  .footlogo{width:auto;height:130px;margin:0 auto 18px}
  .head .cta{font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;background:linear-gradient(135deg,#7a1f2b 0%,#4a0d16 48%,#000000 100%);color:#ffffff;padding:12px 22px;border-radius:999px}
  .head .cta:hover{opacity:.92}
  @media(max-width:700px){
    .head{padding:14px 18px}
    .head nav{display:none}
    .wordmark{font-size:24px}
    .head .cta{padding:8px 12px;font-size:11px}
  }
  /* Hero: image 1, whole, never cropped, never zoomed. No text over the face. */
  .hero{background:#ffffff;color:#1c1a18;text-align:center;padding:64px 20px 80px}
  .hero .eyebrow{font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:#7a1f2b;margin:0 0 32px}
  .hero figure{margin:0 auto;max-width:560px}
  .hero img{width:100%;height:auto;border:1px solid #eeeeee}
  .hero h1{font-size:clamp(44px,8vw,84px);letter-spacing:.32em;text-indent:.32em;font-weight:400;margin:44px 0 14px}
  .hero .cats{font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.30em;text-transform:uppercase;color:#7a1f2b;margin:0}
  .hero p{max-width:520px;margin:22px auto 0;font-size:19px;line-height:1.7;color:#666666}
  .hero .btn{margin-top:32px}
  /* Short intro, no decorative paragraphs */
  .intro{max-width:760px;margin:0 auto;padding:88px 24px 16px;text-align:center}
  .intro h2{font-size:clamp(28px,4vw,42px);font-weight:400;line-height:1.25;margin:0}
  .intro p{font-size:18px;line-height:1.7;color:#666666;margin:20px 0 0}
  .rule{width:56px;height:1px;background:#7a1f2b;margin:0 auto}
  /* Destaques: every photo with a person, large — never a small card.
     Images keep their own ratio (height:auto), so nothing is cropped or zoomed. */
  .section{max-width:1240px;margin:0 auto;padding:88px 28px}
  .section h2{font-size:clamp(26px,3.5vw,38px);font-weight:400;text-align:center;margin:0 0 12px}
  .section .sub{text-align:center;color:#666666;font-size:17px;line-height:1.6;margin:0 0 56px}
  .editorial{display:grid;grid-template-columns:1fr 1fr;gap:64px 56px;align-items:start}
  @media(max-width:700px){.editorial{grid-template-columns:1fr;gap:56px}.section{padding:64px 20px}}
  .editorial figure{margin:0}
  .editorial figcaption{margin-top:18px;display:flex;justify-content:space-between;gap:16px;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#777777}
  .editorial figcaption span:last-child{color:#7a1f2b;white-space:nowrap}
  .wide{max-width:880px;margin:72px auto 0}
  .wide figcaption{margin-top:18px;display:flex;justify-content:space-between;gap:16px;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#777777}
  /* Coleção: cards deliberately SMALLER than the reference, with generous spacing.
     Card max 300px, 48px between columns, 72px between rows. No hover zoom. */
  .collection{background:#ffffff;border-top:1px solid #eeeeee;border-bottom:1px solid #eeeeee}
  .grid{display:grid;grid-template-columns:repeat(3,300px);justify-content:center;gap:72px 48px}
  @media(max-width:1060px){.grid{grid-template-columns:repeat(2,300px)}}
  @media(max-width:700px){.grid{grid-template-columns:300px;gap:56px}}
  .card{margin:0;text-align:center}
  .card .frame{background:#ffffff;border:1px solid #eeeeee}
  .card img{width:100%;height:auto}
  .card figcaption{margin-top:18px}
  .card h3{font-size:19px;font-weight:400;margin:0}
  .card p{font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#999999;margin:10px 0 0}
  .card .price{font-family:Arial,Helvetica,sans-serif;font-size:15px;letter-spacing:.06em;text-transform:none;color:#7a1f2b;margin-top:10px}
  .newhead{margin-top:88px}
  .videos{display:grid;grid-template-columns:repeat(2,360px);justify-content:center;gap:64px 56px}
  @media(max-width:820px){.videos{grid-template-columns:360px}}
  .videos figure{margin:0;text-align:center}
  .videos video{width:100%;height:auto;background:#ffffff;border:1px solid #eeeeee}
  .videos figcaption{margin-top:18px}
  .videos h3{font-size:19px;font-weight:400;margin:0}
  .videos p{font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#999999;margin:10px 0 0}
  .card-actions{margin-top:18px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .btn-small{display:inline-block;background:linear-gradient(135deg,#7a1f2b 0%,#4a0d16 48%,#000000 100%);color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:11px 22px;border-radius:999px}
  .btn-outline{background:#ffffff;border:1px solid #7a1f2b;color:#7a1f2b;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:11px 22px;border-radius:999px;cursor:pointer}
  .order{max-width:640px;margin:0 auto;padding:96px 24px;text-align:center}
  .order h2{font-size:clamp(26px,3.5vw,38px);font-weight:400;margin:0}
  .order p{font-size:18px;line-height:1.7;color:#777777}
  footer{border-top:1px solid #eeeeee;padding:48px 24px;text-align:center}
  footer .wm{font-size:22px;letter-spacing:.42em;text-indent:.42em}
  footer p{font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#999999}

  .detail{display:grid;grid-template-columns:1fr 1fr;gap:64px;max-width:1080px;margin:0 auto;padding:64px 28px;align-items:start}
  @media(max-width:760px){.detail{grid-template-columns:1fr;gap:32px}}
  .detail img{border:1px solid #eeeeee}
  .detail h1{font-size:clamp(28px,4vw,42px);font-weight:400;margin:0}
  .detail .cat{font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#7a1f2b;margin:14px 0}
  .detail .price{font-size:22px;color:#7a1f2b;margin:18px 0}
  .detail p{font-size:17px;line-height:1.7;color:#666666}
  .qty{display:flex;gap:12px;align-items:center;margin:24px 0}
  .qty button{width:40px;height:40px;border:1px solid #eeeeee;background:#ffffff;font-size:18px;cursor:pointer}
  .qty span{min-width:28px;text-align:center;font-size:18px}
  .detail .actions{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
  .cart{max-width:820px;margin:0 auto;padding:64px 28px}
  .cart-row{display:grid;grid-template-columns:96px 1fr auto;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid #eeeeee}
  .cart-row img{border:1px solid #eeeeee}
  .cart-row h3{margin:0;font-weight:400}
  .cart-row p{color:#777777;margin:6px 0}
  .cart-total{font-size:20px;text-align:right;margin:28px 0}
  .note{border:1px solid #eeeeee;padding:24px;margin-top:28px}
  .note p{color:#666666;line-height:1.7}
</style>
</head>
<body>
<header>
  <div class="head">
    <nav><a href="index.html">Início</a><a href="colecao.html" target="_blank" rel="noopener">Coleção</a><a href="index.html#loja">Loja</a><a href="carrinho.html">Carrinho (<span class="cart-count">0</span>)</a></nav>
    <a class="brand" href="index.html"><img class="logo" src="images/celine-logo.png" alt="Logótipo CELINE"><span class="wordmark">CELINE</span></a>
    <a class="cta" href="colecao.html">Ver coleção</a>
  </div>
</header>
<main>
  <div class="detail" id="detail"><p>A carregar a peça…</p></div>
</main>
<footer>
  <img class="footlogo" src="images/celine-logo.png" alt="Logótipo CELINE">
  <div class="wm">CELINE</div>
  <p>Bijuteria de luxo · Brincos · Pulseiras · Anéis · Colares</p>
  <p>© 2026 CELINE</p>
</footer>
<script src="js/produtos.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  const id = new URLSearchParams(location.search).get("id");
  const p = PRODUCTS.find(x=>x.id===id);
  const el = document.getElementById("detail");
  if(!p){ el.innerHTML = "<div><h1>Peça não encontrada</h1><p>Volte à coleção e escolha outra peça.</p><a class=\"btn\" href=\"colecao.html\">Ver a coleção</a></div>"; return; }
  document.title = "CELINE — " + p.name;
  const priceHtml = p.price ? '<p class="price">' + fmtMT(p.price) + '</p>' : '<p class="price">Preço a confirmar</p>';
  const verLabel = (p.id==="p09"||p.id==="n01"||p.id==="n15"||p.id==="n16") ? "conjunto" : "brinco";
  el.innerHTML =
    '<figure style="margin:0"><img src="' + p.img + '" alt="' + p.name + '"></figure>' +
    '<div><h1>' + p.name + '</h1><p class="cat">' + p.cat + '</p>' + priceHtml +
    '<p>' + p.desc + '</p>' +
    '<p>Este ' + verLabel + ' faz parte da coleção CELINE, em fundo branco, sem cortes na fotografia.</p>' +
    '<div class="qty"><button id="minus" type="button">−</button><span id="qty">1</span><button id="plus" type="button">+</button></div>' +
    '<div class="actions"><button class="btn-outline" id="add" type="button">Adicionar ao carrinho</button>' +
    '<button class="btn" id="buy" type="button">Comprar</button>' +
    '<a href="colecao.html">Voltar à coleção</a></div></div>';
  let qty = 1;
  const qEl = document.getElementById("qty");
  document.getElementById("minus").onclick = ()=>{ if(qty>1){ qty--; qEl.textContent=qty; } };
  document.getElementById("plus").onclick = ()=>{ qty++; qEl.textContent=qty; };
  document.getElementById("add").onclick = (e)=>{ addToCart(p.id, qty); e.target.textContent="Adicionado ao carrinho ✓"; };
  document.getElementById("buy").onclick = ()=>{ addToCart(p.id, qty); location.href="carrinho.html"; };
});
</script>
</body>
</html>
